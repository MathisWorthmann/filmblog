<text x="521.5" y="529.5" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="27" fill="#cf9a2c">11</text>
<circle cx="634.6" cy="456.1" r="24" fill="#f8f3ea"/>
<text x="634.6" y="464.1" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="27" fill="#cf9a2c">12</text>
<text x="788.0" y="355.1" text-anchor="start" font-weight="700" font-size="26" fill="#2c2620">gewohnte Welt</text>
<text x="788.0" y="388.1" text-anchor="start" font-size="19" fill="#7a7163">äußeres Problem,</text>
<text x="788.0" y="413.1" text-anchor="start" font-size="19" fill="#7a7163">innerer Mangel</text>
<text x="940.4" y="427.6" text-anchor="start" font-weight="700" font-size="26" fill="#2c2620">Ruf des</text>
<text x="940.4" y="458.6" text-anchor="start" font-weight="700" font-size="26" fill="#2c2620">Abenteuers</text>
<text x="940.4" y="491.6" text-anchor="start" font-size="19" fill="#7a7163">Herausforderung,</text>
<text x="940.4" y="516.6" text-anchor="start" font-size="19" fill="#7a7163">Gefahren in Aussicht</text>
<text x="1028.4" y="595.5" text-anchor="start" font-weight="700" font-size="26" fill="#2c2620">Weigerung</text>
<text x="1028.4" y="628.5" text-anchor="start" font-size="19" fill="#7a7163">Angst vor</text>
<text x="1028.4" y="653.5" text-anchor="start" font-size="19" fill="#7a7163">Veränderung</text>
<text x="1028.4" y="771.5" text-anchor="start" font-weight="700" font-size="26" fill="#2c2620">Mentor</text>
<text x="1028.4" y="804.5" text-anchor="start" font-size="19" fill="#7a7163">verleiht Wissen,</text>
<text x="1028.4" y="829.5" text-anchor="start" font-size="19" fill="#7a7163">Werkzeuge, Waffen</text>
<text x="940.4" y="923.9" text-anchor="start" font-weight="700" font-size="26" fill="#2c2620">erste Schwelle</text>
<text x="940.4" y="956.9" text-anchor="start" font-size="19" fill="#7a7163">neue Welt mit</text>
<text x="940.4" y="981.9" text-anchor="start" font-size="19" fill="#7a7163">neuen Regeln</text>
<text x="788.0" y="996.4" text-anchor="start" font-weight="700" font-size="26" fill="#2c2620">Bewährungs-</text>
<text x="788.0" y="1027.4" text-anchor="start" font-weight="700" font-size="26" fill="#2c2620">proben</text>
<text x="788.0" y="1060.4" text-anchor="start" font-size="19" fill="#7a7163">Abfolge von</text>
<text x="788.0" y="1085.4" text-anchor="start" font-size="19" fill="#7a7163">Konflikten</text>
<text x="612.0" y="1011.9" text-anchor="end" font-weight="700" font-size="26" fill="#2c2620">tiefste Höhle</text>
<text x="612.0" y="1044.9" text-anchor="end" font-size="19" fill="#7a7163">Kernproblem</text>
<text x="612.0" y="1069.9" text-anchor="end" font-size="19" fill="#7a7163">liegt offen</text>
<text x="459.6" y="908.4" text-anchor="end" font-weight="700" font-size="26" fill="#2c2620">entscheidende</text>
<text x="459.6" y="939.4" text-anchor="end" font-weight="700" font-size="26" fill="#2c2620">Prüfung</text>
<text x="459.6" y="972.4" text-anchor="end" font-size="19" fill="#7a7163">krisenhafte</text>
<text x="459.6" y="997.4" text-anchor="end" font-size="19" fill="#7a7163">Zuspitzung</text>
<text x="371.6" y="784.0" text-anchor="end" font-weight="700" font-size="26" fill="#2c2620">Belohnung</text>
<text x="371.6" y="817.0" text-anchor="end" font-size="19" fill="#7a7163">(im)materielles Gut</text>
<text x="371.6" y="595.5" text-anchor="end" font-weight="700" font-size="26" fill="#2c2620">Rückweg</text>
<text x="371.6" y="628.5" text-anchor="end" font-size="19" fill="#7a7163">Gegner formiert</text>
<text x="371.6" y="653.5" text-anchor="end" font-size="19" fill="#7a7163">sich neu</text>
<text x="459.6" y="443.1" text-anchor="end" font-weight="700" font-size="26" fill="#2c2620">Wiedergeburt</text>
<text x="459.6" y="476.1" text-anchor="end" font-size="19" fill="#7a7163">Selbstopfer,</text>
<text x="459.6" y="501.1" text-anchor="end" font-size="19" fill="#7a7163">endgültiger Werteschwenk</text>
<text x="612.0" y="355.1" text-anchor="end" font-weight="700" font-size="26" fill="#2c2620">Heimkehr</text>
<text x="612.0" y="388.1" text-anchor="end" font-size="19" fill="#7a7163">mit „Elixier“ für</text>
<text x="612.0" y="413.1" text-anchor="end" font-size="19" fill="#7a7163">die neue Welt</text>
<rect x="220" y="1190" width="26" height="26" rx="6" fill="#3a7ca5"/>
<text x="258" y="1210" font-weight="700" font-size="21" fill="#2c2620">Akt 1 · Abreise</text>
<text x="258" y="1236" font-size="17" fill="#7a7163">Stufen 1–5</text>
<rect x="595" y="1190" width="26" height="26" rx="6" fill="#c2402f"/>
<text x="633" y="1210" font-weight="700" font-size="21" fill="#2c2620">Akt 2 · Initiation</text>
<text x="633" y="1236" font-size="17" fill="#7a7163">Stufen 6–9</text>
<rect x="970" y="1190" width="26" height="26" rx="6" fill="#cf9a2c"/>
<text x="1008" y="1210" font-weight="700" font-size="21" fill="#2c2620">Akt 3 · Rückkehr</text>
<text x="1008" y="1236" font-size="17" fill="#7a7163">Stufen 10–12</text>
<text x="700" y="1266" text-anchor="middle" font-size="16" fill="#7a7163" font-style="italic">Eigene Darstellung in Anlehnung an Vogler (2007)</text>
</svg>